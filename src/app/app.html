<div class="min-h-screen bg-[#F8F9FA] text-[#1A1A1B] font-sans flex flex-col transition-colors duration-500">
  
  <!-- Zen Mode Pull-down Handle -->
  @if (isZenMode()) {
    <div class="fixed top-0 right-4 md:right-10 z-[100] animate-in slide-in-from-top fade-in duration-300">
      <button (click)="isZenMode.set(false)" aria-label="Thoát chế độ Zen Mode" title="Thoát chế độ Zen Mode" class="w-10 h-8 md:w-11 md:h-9 bg-gray-800/90 hover:bg-black border-none text-white flex items-center justify-center rounded-b-xl backdrop-blur-md shadow-lg transition-all cursor-pointer outline-none active:scale-95">
        <mat-icon class="w-5 h-5 md:w-6 md:h-6 flex items-center justify-center font-bold" style="font-size: 24px; line-height: 24px; width: 24px; height: 24px;">expand_less</mat-icon>
      </button>
    </div>
  }

  <app-header 
    [isZenMode]="isZenMode()"
    [userApiKey]="storageManager.userApiKey()"
    [isLoading]="isLoading()"
    [isSearchLoading]="searchTranslationTracker.isSearchLoading()"
    [selectedModel]="selectedModel()"
    [uploadedHtmlFile]="uploadedHtmlFile()"
    [url]="url()"
    [isValidUrlInput]="isValidUrlInput()"
    [fullHtmlString]="fullHtmlString()"
    (openApiKeyModal)="openApiKeyModal()"
    (selectedModelChange)="selectedModel.set($event)"
    (urlChange)="url.set($event)"
    (removeUploadedFile)="removeUploadedFile()"
    (fileSelected)="onFileSelected($event)"
    (translate)="translate()">
  </app-header>

  <main class="flex-1 flex flex-col w-full" 
        [class.px-4]="!fullHtmlString() || isLoading()" 
        [class.md:px-10]="!fullHtmlString() || isLoading()"
        [class.items-center]="!fullHtmlString() || isLoading()">    @if (isLoading()) {
      <app-translation-loading [formattedTime]="formattedTime()"></app-translation-loading>
    }

    @if (!fullHtmlString() && !isLoading()) {
      <app-initial-view
        [searchQuery]="searchTranslationTracker.searchQuery()"
        [translatedSearchQuery]="searchTranslationTracker.translatedSearchQuery()"
        [isSearchLoading]="searchTranslationTracker.isSearchLoading()"
        [favoriteSites]="storageManager.favoriteSites()"
        (searchQueryChange)="searchTranslationTracker.setSearchQuery($event)"
        (translatedSearchQueryChange)="searchTranslationTracker.translatedSearchQuery.set($event)"
        (translateSearch)="searchTranslationTracker.translateSearchQuery(storageManager.userApiKey())"
        (searchLinkClick)="searchTranslationTracker.onSearchLinkClick()"
        (openSitesModal)="openSitesModal()">
      </app-initial-view>
    }

    @if (fullHtmlString() && !isLoading()) {
      <app-result-view
        [isZenMode]="isZenMode()"
        [translatedTitle]="translatedTitle()"
        [fullHtmlString]="fullHtmlString()"
        (closeTranslation)="closeTranslation()"
        (enableZenMode)="isZenMode.set(true)"
        (downloadHtml)="downloadHtml()">
      </app-result-view>
    }


  </main>

  <!-- Footer -->
  <app-footer 
    [isZenMode]="isZenMode()" 
    [isLoading]="isLoading()" 
    [isSearchLoading]="searchTranslationTracker.isSearchLoading()" 
    [useSearchGrounding]="useSearchGrounding()"
    (openHistory)="isHistoryModalOpen.set(true)"
    (openShare)="isShareModalOpen.set(true)"
    (toggleSearchGrounding)="useSearchGrounding.set($event)">
  </app-footer>

  <!-- Share Modal -->
  @if (isShareModalOpen()) {
    <app-share-modal (closeModal)="isShareModalOpen.set(false)"></app-share-modal>
  }

  <!-- History Modal -->
  @if (isHistoryModalOpen()) {
    <app-history-modal (closeModal)="isHistoryModalOpen.set(false)" (loadHistory)="loadHistoryItem($event)"></app-history-modal>
  }

  <!-- Sites Modal -->
  @if (isSitesModalOpen()) {
    <app-sites-modal [favoriteSites]="storageManager.favoriteSites()" (closeModal)="isSitesModalOpen.set(false)" (saveSitesData)="saveSites($event)"></app-sites-modal>
  }

  <!-- API Key Modal -->
  @if (isApiKeyModalOpen()) {
    <app-api-key-modal [userApiKey]="storageManager.userApiKey()" (closeModal)="isApiKeyModalOpen.set(false)" (saveApiKey)="saveApiKey($event)"></app-api-key-modal>
  }
</div>
<router-outlet />

<app-toast></app-toast>
